# ====================================================================
# Tmux Configuration
# ====================================================================
# Author: Dennis Bakhuis
# Date: 2025-10-12
#
# Key Bindings Quick Reference:
# ------------------------------
# Prefix: Ctrl-b (default)
#
# Windows (tabs):
#   c           - Create new window
#   ,           - Rename current window
#   n/p         - Next/Previous window
#   0-9         - Switch to window by number
#   BSpace      - Last (previously active) window
#   Ctrl-h/l    - Previous/Next window (repeatable)
#   < / >       - Move current window to first / last position
#   &           - Kill current window
#
# Panes (splits):
#   |           - Split horizontally (left/right)
#   -           - Split vertically (top/bottom)
#   h/j/k/l     - Navigate panes (vim-style)
#   H/J/K/L     - Resize panes (repeatable)
#   x           - Kill current pane
#   z           - Zoom/unzoom current pane
#   space       - Cycle through layouts
#
# Popups (float over the window, close when the program exits):
#   Tab         - Throwaway shell in the current folder
#   g           - gitui
#   t           - Directory tree (q to close)
#
# Agents (tmux-agent-sidebar):
#   e / E       - Toggle agent sidebar (this window / all windows)
#   Window tabs show agent state: ● running  ◐ waiting for you  ○ idle  ✕ error
#
# Copy mode (vi-style):
#   [           - Enter copy mode
#   v           - Start selection
#   y           - Copy selection to the system clipboard
#   q           - Exit copy mode
#   Mouse drag  - Select text
#   Mouse click - Copy selection (after drag, click in selected area)
#
# Other:
#   r           - Reload tmux config
#   ?           - Show all key bindings
# ====================================================================

# Ensure Homebrew bin is on PATH for `run-shell` invocations (tpm and plugin
# scripts shell out to bare `tmux`, which lives in /opt/homebrew/bin on macOS).
# The tmux server can be launched with a minimal PATH (e.g. /usr/bin:/bin:...),
# which makes those calls fail silently.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hiroppy/tmux-agent-sidebar'

set-option -g history-limit 25000
set -g mouse on

# for neovim
set -sg escape-time 10
setw -g xterm-keys on
set -g allow-passthrough on

# vi for copy mode
setw -g mode-keys vi

# Clipboard: prefer isomorphic_copy (works over SSH), then pbcopy; otherwise
# tmux falls back to OSC 52 via set-clipboard.
if-shell '[ -x "$HOME/.tools/isomorphic_copy/bin/c" ]' \
    'set -s copy-command "$HOME/.tools/isomorphic_copy/bin/c"' \
    'if-shell "command -v pbcopy" "set -s copy-command pbcopy"'

# Vi-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Mouse: drag to select, click in the selected area to copy
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X copy-pipe \; send-keys -X clear-selection

# ---------------------------------------------------------------------
# Theme: deep-sea navy (matches alacritty background #001728)
#   bar #00101c   text #a9b1d6   muted #3b5568   border #12303f
#   accent cyan #0db9d7   running green #9ece6a
#   waiting amber #e0af68  error red #f7768e
# ---------------------------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#00101c,fg=#a9b1d6"

# Left: prompt glyph, turns into an amber ^B badge while the prefix is held
set -g status-left "#{?client_prefix,#[fg=#00101c#,bg=#e0af68#,bold] ^B #[default],#[fg=#0db9d7#,bold] ❯_ #[default]} "
set -g status-left-length 20

# Center: window list, each tab followed by the state of the agents inside it
set -g @agent_glyphs "#{P:#{?#{==:#{@pane_status},running},#[fg=#9ece6a] ●,#{?#{==:#{@pane_status},waiting},#[fg=#e0af68] ◐,#{?#{==:#{@pane_status},error},#[fg=#f7768e] ✕,#{?#{==:#{@pane_status},idle},#[fg=#3b5568] ○,}}}}}"
set -g status-justify centre
set -g window-status-format "#[fg=#3b5568] #I:#W#{E:@agent_glyphs} "
set -g window-status-current-format "#[fg=#0db9d7,bold] #I:#W#[nobold]#{E:@agent_glyphs} "
set -g window-status-separator "#[fg=#12303f]│"
set -g window-status-activity-style none
set -g window-status-bell-style "fg=#e0af68"

# Window name = git repo basename / dir basename (shared with claude statusline).
# allow-rename off ignores OSC title escapes (e.g. Claude Code's version string).
# Manual `prefix ,` rename still works — it just disables auto-rename for that window.
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#(~/dotfiles/scripts/folder-name.sh '#{pane_current_path}')}#{?pane_dead,[dead],}"

# Right: agents waiting for input (all windows), host when over SSH, clock
set -g status-right "#(~/dotfiles/scripts/tmux-status-right.sh)#[fg=#3b5568] %a %d %b #[fg=#0db9d7,bold]%H:%M "
set -g status-right-length 60

# Borders, messages, copy mode, popups
set -g pane-border-style "fg=#12303f"
set -g pane-active-border-style "fg=#0db9d7"
set -g message-style "bg=#0db9d7,fg=#00101c,bold"
set -g message-command-style "bg=#00101c,fg=#0db9d7"
set -g mode-style "bg=#0db9d7,fg=#00101c"
set -g popup-border-style "fg=#0db9d7"
set -g popup-border-lines rounded
setw -g clock-mode-colour "#0db9d7"

# count the panes from 1
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# reload configuration
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# unbind ctrl enter
unbind C-Enter

# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# Switch panes with hjkl (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL (hold prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better window splitting (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Easy window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Move current window to the first / last position (shifts the others).
# Index 0 is always free (base-index 1); a bare ':' target means "next unused
# index"; move-window -r renumbers so there are no gaps.
bind < move-window -t :0 \; move-window -r
bind > move-window -t : \; move-window -r

# Unbind the default move-window prompt on '.', which is '>' without shift
# and otherwise leaves a "(move-window)" prompt sitting in the status line.
unbind .

# Last window (the default `l` is taken by pane navigation)
bind BSpace last-window

# Popups
bind Tab display-popup -E -w 80% -h 75% -d "#{pane_current_path}"
bind g   display-popup -E -w 92% -h 92% -d "#{pane_current_path}" gitui
bind t   display-popup -E -w 60% -h 85% -d "#{pane_current_path}" \
    "lsd --tree --depth 4 --group-directories-first --color=always --icon=always -I .git -I node_modules -I .venv -I __pycache__ | env LESSUTFBINFMT='*n%C' less -R"

set-option -g focus-events on
set-option -g set-clipboard on

# Shell — leave default-command unset so tmux launches default-shell with
# argv[0]="-fish", which fish recognises as a login-shell invocation. This
# triggers path_helper (so /opt/homebrew/bin lands on PATH and `command -v`
# checks in conf.d/aliases.fish succeed) and `status is-login` blocks fire
# (fastfetch, etc.) without spawning an extra fish -c wrapper.
if-shell '[ -x /opt/homebrew/bin/fish ]' \
    'set -g default-shell /opt/homebrew/bin/fish' \
    'run-shell "f=$(command -v fish) && tmux set -g default-shell $f"'

# tmux-agent-sidebar: on demand only (prefix e / E); window tabs carry the
# agent state the rest of the time. Colors follow the theme above.
set -g @sidebar_auto_create off
set -g @sidebar_width 18%
set -g @sidebar_color_accent "#0db9d7"
set -g @sidebar_color_border "#12303f"
set -g @sidebar_color_running "#9ece6a"
set -g @sidebar_color_waiting "#e0af68"
set -g @sidebar_color_idle "#3b5568"
set -g @sidebar_color_error "#f7768e"
set -g @sidebar_color_session "#0db9d7"
set -g @sidebar_color_branch "#9ece6a"
set -g @sidebar_color_section_title "#0db9d7"
set -g @sidebar_color_text_muted "#3b5568"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# tpm sometimes exits non-zero even after a clean run (e.g. when one plugin's
# .tmux file emits a non-fatal warning), which makes tmux pop a viewer that
# needs a keypress to dismiss. Force exit 0 and redirect output to a log so the
# viewer never appears but failures stay debuggable (tail /tmp/tpm.log).
# PATH is set inline as belt-and-suspenders alongside the set-environment above.
run -b "PATH='/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin' ~/.tmux/plugins/tpm/tpm >/tmp/tpm.log 2>&1 || true"
